name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://fitness-platform-prod.firebaseapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/mobile/package-lock.json

    # Production deploy disabled - this repo is for mobile app only
    # Web app is in separate repo (fitness-platform-web) with Vercel auto-deploy
    # Mobile app builds happen locally via: npx expo run:android --variant release

    - name: Check repository structure
      run: |
        echo "✅ This is the mobile app repository"
        echo "📱 Mobile app location: apps/mobile/"
        echo "🌐 Web app is deployed from: fitness-platform-web repo (Vercel)"
        echo "🌐 Landing page is deployed from: fitness-platform-landing repo (Vercel)"
        ls -la apps/mobile/

    - name: Notify
      run: |
        echo "ℹ️  This workflow is disabled"
        echo "ℹ️  Mobile APK builds happen locally"
        echo "ℹ️  Web deployments happen via Vercel on push to fitness-platform-web repo"