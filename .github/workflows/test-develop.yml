name: Test Development Branch

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          packages/shared-types/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install shared-types dependencies
      run: |
        cd packages/shared-types
        npm ci

    - name: Check mobile app structure
      run: |
        echo "Mobile app directory structure:"
        ls -la
        echo "✅ Mobile app structure check passed"

    - name: Run linting
      run: npm run lint